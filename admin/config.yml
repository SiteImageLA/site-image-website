backend:
  name: github
  repo: /SiteImageLA/site-image-website
  branch: main

media_folder: static/images
public_folder: /images

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Residential", "Aged Care & Seniors Living", "Public Realm", "Commercial", "Masterplan", "Educational", "Public Art", "Hospitality", "Health"] }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Architect", name: "architect", widget: "string", required: false }
      - { label: "Builder", name: "builder", widget: "string", required: false }
      - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: false }
      - { label: "Featured Image", name: "featured_image", widget: "image" }
      - { label: "Gallery Images", name: "gallery", widget: "list", field: { label: "Image", name: "image", widget: "image" } }
      - { label: "Description", name: "description", widget: "markdown" }
